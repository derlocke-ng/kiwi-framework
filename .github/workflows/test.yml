name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Types
        run: npm run typecheck
      - name: Lint and format
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: A distribution from scratch builds
        run: npm run test:smoke

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Chromium for the browser tests
        run: npx playwright-core install --with-deps chromium
      - name: The widgets and the boards app in a browser
        run: npm run test:e2e
